included:
  - swiftcode/Package.swift
  - swiftcode/Sources
  - swiftcode/Tests
  - swiftcode/Tools
  - frameworks
  - composer/Package.swift
  - composer/Sources
  - composer/Tests
excluded:
  - "**/.build"
  - swiftcode/.swiftpm
  - swiftcode/Tests/SwiftCodeProjectTests/Fixtures
  - swiftcode/Tests/SwiftCodeWorkspaceTests/Fixtures
  - frameworks/healthkit/Sources/HealthKit/Generated
  - frameworks/homekit/Sources/HomeKit/Generated
  - frameworks/swiftui/Tests/OpenViewsTests/GoldenLayoutTests.swift
  - frameworks/swiftui/Tests/OpenViewsTests/GoldenSpacingTests.swift
  - frameworks/swiftui/Tests/OpenViewsTests/GoldenViewLayoutTests.swift
  - frameworks/swiftui/Tests/OpenViewsTests/Support/GoldenTextRuns.swift
disabled_rules:
  - identifier_name
  - type_name
  - line_length
  - trailing_comma
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - large_tuple
  - nesting
  - type_body_length
  - statement_position
  - switch_case_alignment
  - optional_data_string_conversion
  - static_over_final_class
  - multiple_closures_with_trailing_closure
  - inclusive_language
opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - first_where
  - identical_operands
  - joined_default_parameter
  - last_where
  - local_doc_comment
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unhandled_throwing_task
  - yoda_condition
force_cast: error
force_try: error
redundant_discardable_let:
  ignore_swiftui_view_bodies: true
opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true
