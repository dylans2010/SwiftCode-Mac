# Release pipeline for the Sparkle 2 update system.
#
# Trigger: pushing a tag like v1.2.3. The tag's version MUST correspond to
# a CURRENT_PROJECT_VERSION bump in the Xcode project (see Docs/Updates.md):
# Sparkle compares CFBundleVersion, so a release whose build number is not
# greater than the installed build is never offered.
#
# This workflow is deliberately fail-fast: if any signing secret is missing
# it stops BEFORE building or publishing anything, so a release can never
# go out unsigned or without an appcast. The appcast is verified to contain
# a sparkle:edSignature before the DMG and appcast are uploaded, and the
# upload happens last, so installed copies never see an appcast entry for
# an artifact that does not exist.
#
# Existing build.yml / ci.yml are untouched: they remain the unsigned
# build-check pipelines. Only this workflow publishes updates.
#
# Required repository secrets (names only; values never appear in logs):
#   SPARKLE_PRIVATE_KEY              EdDSA private key from Sparkle's generate_keys
#   DEVELOPER_ID_CERTIFICATE         Base64-encoded Developer ID Application .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  Password for that .p12
#   APPLE_ID                         Apple ID used for notarization
#   APPLE_APP_PASSWORD               App-specific password for notarization
#   APPLE_TEAM_ID                    Developer team ID
# The matching public key must already be embedded in the app as
# SUPublicEDKey in SwiftCode/Info.plist (see Docs/Updates.md) BEFORE the
# release that clients will install from; a build without it fails closed
# at install time on the client.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify signing prerequisites
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in SPARKLE_PRIVATE_KEY DEVELOPER_ID_CERTIFICATE DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release aborted before publishing: missing required secret(s):$missing"
            echo "Configure them in the repository settings (see Docs/Updates.md). No artifact was built or uploaded."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          echo "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$CERT_PATH"

      - name: Build signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project SwiftCode.xcodeproj \
            -scheme SwiftCode \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          APP_PATH="./build/DerivedData/Build/Products/Release/SwiftCode.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::SwiftCode.app bundle was not found at $APP_PATH"
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="./build/DerivedData/Build/Products/Release/SwiftCode.app"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/SwiftCode.zip"
          xcrun notarytool submit "$RUNNER_TEMP/SwiftCode.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="./build/DerivedData/Build/Products/Release/SwiftCode.app"
          DMG_NAME="SwiftCode.dmg"
          STAGING_DIR="./build/dmg-staging"
          rm -rf "$STAGING_DIR" "$DMG_NAME"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/SwiftCode.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "SwiftCode" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Download Sparkle tools
        run: |
          # Resolve the latest Sparkle release asset dynamically instead of
          # pinning a version that may not exist when this workflow runs.
          ASSET_URL="$(gh api repos/sparkle-project/Sparkle/releases/latest --jq '.assets[] | select(.name | endswith(".tar.xz")) | .browser_download_url' | head -n 1)"
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Could not find a Sparkle .tar.xz asset on the latest Sparkle release."
            exit 1
          fi
          echo "Downloading Sparkle tools from: $ASSET_URL"
          curl -L "$ASSET_URL" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"
          GENERATE_APPCAST="$(find "$RUNNER_TEMP/sparkle-tools" -name generate_appcast -type f | head -n 1)"
          if [ -z "$GENERATE_APPCAST" ] || [ ! -x "$GENERATE_APPCAST" ]; then
            echo "::error::generate_appcast was not found in the downloaded Sparkle tools."
            exit 1
          fi
          echo "GENERATE_APPCAST=$GENERATE_APPCAST" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and verify appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The private key lives only in a 600-permission temp file for the
          # duration of this step and is removed immediately afterwards.
          KEY_FILE="$RUNNER_TEMP/sparkle-private-key.txt"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          mkdir -p ./build/appcast-input
          cp SwiftCode.dmg ./build/appcast-input/
          "$GENERATE_APPCAST" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/dylans2010/SwiftCode-Mac/releases/download/${TAG}/" \
            -o appcast.xml \
            ./build/appcast-input
          rm -f "$KEY_FILE"
          # Verification gate: never publish an appcast without a signature
          # or pointing at an artifact that is not in this release.
          if ! grep -q 'sparkle:edSignature=' appcast.xml; then
            echo "::error::Generated appcast.xml has no sparkle:edSignature. Nothing was uploaded."
            exit 1
          fi
          if ! grep -q "releases/download/${TAG}/SwiftCode.dmg" appcast.xml; then
            echo "::error::Generated appcast.xml does not reference SwiftCode.dmg for tag ${TAG}. Nothing was uploaded."
            exit 1
          fi
          echo "Appcast verified:"
          cat appcast.xml

      - name: Publish DMG and appcast to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwiftCode.dmg
            appcast.xml
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
